spring:
  profiles:
    active: mongo # mongo | jpa

  activemq:
    in-memory: true
    pool:
      enabled: false
#    broker-url: tcp://localhost:61616
#    user: admin
#    password: admin

  application:
      name: ${introspec_sso_context_path:auth-service}

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  ldap:
    # Embedded Spring LDAP
    #
    # urls: ldap://localhost:12345
    # base: dc=memorynotfound,dc=com
    # username: uid=admin
    # password: secret
    embedded:
      base-dn: dc=memorynotfound,dc=com
      credential:
        username: uid=admin
        password: secret
      ldif: classpath:schema.ldif
      port: 12345
      validation:
        enabled: false

logging:
  level:
    org:
      apache:
        tomcat: DEBUG
        catalina: DEBUG
      springframework:
        web:
          filter:
            CommonsRequestLoggingFilter: DEBUG
      hibernate:
        SQL: DEBUG
    com:
      activedge:
        usermgt: INFO


    root: INFO
#  file: ${java.io.tmpdir}/${spring.application.name}.log
#  path=/var/logs/app.log

security:
  jwt:
    secret: ${introspec_sso_jwt_secret:JwtSecretKey123}
    expiration: 8_60_60_000 # 24 hours

cors:
  allowed_headers: X-Requested-With,Content-Type,Authorization,Module,Origin,Accept,Access-Control-Request-Method,Access-Control-Request-Headers,affiliateCode,Affiliate,Affiliate-Code
  allowed_origins: ${introspec_sso_cors_origins:http://localhost:3019,http://localhost:3005,http://10.8.243.1,https://10.8.243.1}

server:
  port: ${introspec_sso_port:9100}
  servlet:
    context-path: /${introspec_sso_context_path:${spring.application.name}}
#  tomcat:
#    basedir: logs
#    accesslog:
#      enabled: true
#      pattern: common #'%t %a "%r" %s (%D ms)'
#      prefix: access_log
#      suffix: .log

introspecsso:
  backend: ${introspec_sso_auth_mode:db} # db | ldap

ldap:
  url: ${introspec_sso_ldap_url:ldap://137.116.126.254:389}
  base: ${introspec_sso_ldap_base:DC=activedge,DC=local}
  user: ${introspec_sso_ldap_user:activedge\introspec_user}
  password: ${introspec_sso_ldap_password:1nt@GH4acce$$}
  ou: ${introspec_sso_ldap_ou:ou=staffs}
  filter: ${introspec_sso_ldap_filter:sAMAccountName}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true

management:
#  This will trigger security on
#  server:
#    port: 9200
  endpoints:
    web:
      exposure:
        include: '*'
      cors:
        allowed-origins: ${cors.allowed_origins}
        allowed-methods: GET
#      base-path: /admin-console-metrics
