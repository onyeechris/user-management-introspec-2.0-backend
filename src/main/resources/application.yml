server:
  port: 9100
  servlet:
    context-path: /${spring.application.name}

spring:
  profiles:
    active: mongo # e.g mongo | jpa #-note you can have two profiles active!
#  main:
#    allow-bean-definition-overriding: true
  application:
      name: auth-service

#  data:
#    rest:
#      basePath: /auth-service
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  ldap:

    # Spring LDAP
    #
    # In this example we use an embedded ldap server. When using a real one,
    # you can configure the settings here.
    #
    # urls: ldap://localhost:12345
    # base: dc=memorynotfound,dc=com
    # username: uid=admin
    # password: secret

    # Embedded Spring LDAP
    embedded:
      base-dn: dc=memorynotfound,dc=com
      credential:
        username: uid=admin
        password: secret
      ldif: classpath:schema.ldif
      port: 12345
      validation:
        enabled: false

app:
  jwtExpirationInMs: '604800000'
  jwtSecret: JWTSuperSecretKeyy
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
#    root: DEBUG
    com:
      activedge:
        usermgt: DEBUG
#    root: DEBUG
#  file: ${java.io.tmpdir}/${spring.application.name}.log

security:
  jwt:
    secret: JwtSecretKey123
    expiration: 8_60_60_000 # 24 hours
