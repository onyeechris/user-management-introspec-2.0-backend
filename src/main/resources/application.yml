###
spring:
  main:
    allow-bean-definition-overriding: true
  application:
      name: auth-service

  data:
    rest:
      basePath: /auth-service
  jpa:
      database-platform: org.hibernate.dialect.PostgreSQL9Dialect
      database: POSTGRESQL
      show-sql: true
      generate-ddl: true

      hibernate:
          ddl-auto: update #  never use ddl generation in production
      properties:
          hibernate.id.new_generator_mappings: true
          hibernate.connection.provider_disables_autocommit: true
          hibernate.cache.use_second_level_cache: false
          hibernate.cache.use_query_cache: false
          hibernate.generate_statistics: false
          hibernate:
              jdbc:
                lob:
                  non_contextual_creation: true

#  redis:
#    host: localhost
#    port: 6379
#    embedded: true

  datasource.driver-class-name: org.postgresql.Driver
  datasource.type: com.zaxxer.hikari.HikariDataSource
  datasource.url: jdbc:postgresql://localhost:5432/usermgt
  datasource.username: postgres
  datasource.password: passadmin
  datasource:
#      driverClassName: org.postgresql.Driver
#      type: com.zaxxer.hikari.HikariDataSource
#      url: jdbc:postgresql://localhost:5432/usermgt?createDatabaseIfNotExist=true
#      username: postgres
#      password: passadmin
      hikari:
          auto-commit: false
          minimum-idle: 3
          maximum-pool-size: 5

    #      initialization-mode: always
      data: classpath:modules.sql, classpath:authorities.sql, classpath:groups.sql, classpath:staff.sql, classpath:staff_authorities.sql, classpath:permissions.sql

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  ldap:

    # Spring LDAP
    #
    # In this example we use an embedded ldap server. When using a real one,
    # you can configure the settings here.
    #
    # urls: ldap://localhost:12345
    # base: dc=memorynotfound,dc=com
    # username: uid=admin
    # password: secret

    # Embedded Spring LDAP
    embedded:
      base-dn: dc=memorynotfound,dc=com
      credential:
        username: uid=admin
        password: secret
      ldif: classpath:schema.ldif
      port: 12345
      validation:
        enabled: false

app:
  jwtExpirationInMs: '604800000'
  jwtSecret: JWTSuperSecretKeyy
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
#    root: DEBUG
    com:
      activedge:
        usermgt: DEBUG
#    root: DEBUG
#  file: ${java.io.tmpdir}/${spring.application.name}.log

#  using for JavaSE:  java -Dspring.redis.embedded=true
makerChecker:
  enabled: true

security:
  jwt:
    secret: JwtSecretKey123

server:
  port: 9100
  servlet:
    context-path: /${spring.application.name}
